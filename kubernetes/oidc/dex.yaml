# OIDC SSO for the cluster via Dex (Flux HelmRelease template).
#
# This gives `kubectl` (and the dashboard) login through your identity provider
# (Google, GitHub, Entra ID, Authentik, Keycloak, ...).
#
# After deploying, configure kubeconfig auth:
#   kubectl oidc-login setup --oidc-issuer-url=https://dex.<domain>/dex ...
#
# Replace all <placeholders> before applying.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: dex
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.dexidp.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dex
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: dex
      sourceRef:
        kind: HelmRepository
        name: dex
  values:
    # ingress:
    #   enabled: true
    #   ingressClassName: <your-ingress-class>
    #   hosts:
    #     - host: dex.<domain>
    #       paths: [{ path: /, pathType: Prefix }]
    #   tls: [{ secretName: dex-tls, hosts: [dex.<domain>] }]
    env:
      - name: GITHUB_CLIENT_ID
        valueFrom: { secretKeyRef: { name: dex-oidc, key: github-client-id } }
      - name: GITHUB_CLIENT_SECRET
        valueFrom: { secretKeyRef: { name: dex-oidc, key: github-client-secret } }
    config:
      issuer: https://dex.<domain>/dex
      storage:
        type: kubernetes
        config:
          inCluster: true
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: $GITHUB_CLIENT_ID
            clientSecret: $GITHUB_CLIENT_SECRET
            redirectURI: https://dex.<domain>/dex/callback
            orgs:
              - name: <your-github-org>
      staticClients:
        - id: kubectl
          name: kubectl
          redirectURIs:
            - http://localhost:8000/callback
            - http://localhost:18000/callback
          secret: <generate-a-strong-secret>
---
# Cluster OIDC config so the API server validates Dex tokens.
apiVersion: v1alpha1
kind: OIDCAuthProxyConfig
metadata:
  name: oidc
  namespace: kube-system
  annotations:
    # Applied via a Talos machine config patch instead if preferred:
    #   cluster.apiServerConfig.oidc*
    note: "Set cluster OIDC flags via Talos config patch (see below)"
---
# Talos machine config patch (add to extra_config_patches on control planes):
#
# cluster:
#   apiServerConfig:
#     oidcIssuerURL: https://dex.<domain>/dex
#     oidcClientID: kubectl
#     oidcUsernameClaim: email
#     oidcGroupsClaim: groups
