---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cilium-values
  namespace: kube-system
data:
  values.yaml: |-
    cluster:
      name: ${cluster_name}
      id: "${cluster_cilium_id}"
    kubeProxyReplacement: true
    bgpControlPlane:
      enabled: true  
    k8sServiceHost: localhost
    k8sServicePort: 7445
    securityContext:
      capabilities:
        ciliumAgent: [ CHOWN,KILL,NET_ADMIN,NET_RAW,IPC_LOCK,SYS_ADMIN,SYS_RESOURCE,DAC_OVERRIDE,FOWNER,SETGID,SETUID ]
        cleanCiliumState: [ NET_ADMIN,SYS_ADMIN,SYS_RESOURCE ]
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    ipam:
      mode: cluster-pool
      operator:
        clusterPoolIPv4PodCIDRList: ["${cluster_ipv4_cidr_pool}"]
    ipv4NativeRoutingCIDR: "${cluster_ipv4_cidr_pool}"
    l2announcements:
      enabled: true
    externalIPs:
      enabled: true
    hubble:
      relay:
        enabled: true
      ui:
        enabled: true