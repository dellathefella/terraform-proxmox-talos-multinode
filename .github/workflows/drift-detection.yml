name: Drift Detection

on:
  schedule:
    - cron: "30 5 * * *"   # daily
  workflow_dispatch:

jobs:
  drift:
    if: vars.PM_ENDPOINT != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Init
        working-directory: ci/plan
        run: tofu init

      - name: Plan (detect drift)
        id: plan
        working-directory: ci/plan
        env:
          TF_VAR_pm_endpoint: ${{ vars.PM_ENDPOINT }}
          PROXMOX_VE_API_TOKEN: ${{ secrets.PM_API_TOKEN }}
        continue-on-error: true
        run: |
          tofu plan -input=false -detailed-exitcode -no-color > plan.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Open issue on drift
        if: steps.plan.outputs.exit == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('ci/plan/plan.txt', 'utf8');
            const title = `Drift detected in ${new Date().toISOString().slice(0, 10)}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'drift', state: 'open',
            });
            const body = `Daily plan detected changes (manual edits in PVE or pending updates):\n\n\`\`\`diff\n${plan.slice(0, 60000)}\n\`\`\``;
            if (issues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['drift'],
              });
            }
